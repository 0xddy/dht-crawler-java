  # 默认每次发版都跑：与 Linux 并行，上传 Windows 胖 JAR + win native 模块 jar
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 下载 JNI (Windows) — push tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -e
          JSON=$(curl -sSL -H "Accept: application/vnd.github+json" "${{ env.DHT_CRAWLER_API }}/releases/latest")
          echo "$JSON" | python3 -c "
          import json, sys, os, urllib.request, zipfile, shutil
          j = json.load(sys.stdin)
          for a in j['assets']:
              if a['name'].startswith('dht_crawler_jni-') and a['name'].endswith('x86_64-pc-windows-gnu.zip'):
                  urllib.request.urlretrieve(a['browser_download_url'], 'jni.zip')
                  zipfile.ZipFile('jni.zip').extractall('jni_out')
                  d = 'dht-jni-native-win-x64/src/main/resources/native/win-x64'
                  os.makedirs(d, exist_ok=True)
                  for root, _, files in os.walk('jni_out'):
                      for f in files:
                          if f.lower().endswith('.dll'):
                              shutil.copy2(os.path.join(root, f), os.path.join(d, 'dht_crawler.dll'))
                              print('OK', a['name']); sys.exit(0)
                  sys.exit('no dll')
          sys.exit('no windows jni zip')
          "

      - name: 下载 JNI (Windows) — 手动 + release_zip
        if: github.event_name == 'workflow_dispatch' && inputs.native_source == 'release_zip'
        shell: bash
        run: |
          set -e
          TAG="${{ inputs.dht_crawler_tag }}"
          if [ -n "$TAG" ]; then API="${{ env.DHT_CRAWLER_API }}/releases/tags/${TAG}"; else API="${{ env.DHT_CRAWLER_API }}/releases/latest"; fi
          JSON=$(curl -sSL -H "Accept: application/vnd.github+json" "$API")
          echo "$JSON" | python3 -c "
          import json, sys, os, urllib.request, zipfile, shutil
          j = json.load(sys.stdin)
          for a in j['assets']:
              if a['name'].startswith('dht_crawler_jni-') and a['name'].endswith('x86_64-pc-windows-gnu.zip'):
                  urllib.request.urlretrieve(a['browser_download_url'], 'jni.zip')
                  zipfile.ZipFile('jni.zip').extractall('jni_out')
                  d = 'dht-jni-native-win-x64/src/main/resources/native/win-x64'
                  os.makedirs(d, exist_ok=True)
                  for root, _, files in os.walk('jni_out'):
                      for f in files:
                          if f.lower().endswith('.dll'):
                              shutil.copy2(os.path.join(root, f), os.path.join(d, 'dht_crawler.dll'))
                              sys.exit(0)
                  sys.exit('no dll')
          sys.exit('no windows jni zip')
          "

      - uses: dtolnay/rust-toolchain@stable
        if: github.event_name == 'workflow_dispatch' && inputs.native_source == 'cargo'

      - name: Cargo JNI (Windows)
        if: github.event_name == 'workflow_dispatch' && inputs.native_source == 'cargo'
        shell: bash
        run: |
          git clone --depth 1 "${{ env.DHT_CRAWLER_REPO }}" dht-crawler-build
          cd dht-crawler-build && cargo build --release --features jni
          mkdir -p ../dht-jni-native-win-x64/src/main/resources/native/win-x64
          cp -v target/release/dht_crawler.dll ../dht-jni-native-win-x64/src/main/resources/native/win-x64/ 2>/dev/null || \
          cp -v target/release/libdht_crawler.dll ../dht-jni-native-win-x64/src/main/resources/native/win-x64/dht_crawler.dll

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-win-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Windows 胖 JAR + win native 模块
        shell: bash
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}"
          EXTRA=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.library_version }}" ]; then
            EXTRA="-Pdht.kt.version=${{ inputs.library_version }}"
          fi
          ./gradlew.bat $EXTRA :dht-jni-sample:shadowJar :dht-jni-native-win-x64:jar --no-daemon
          mkdir -p dist
          cp "$(ls dht-jni-sample/build/libs/dht-sample-*-all.jar | head -1)" "dist/dht-sample-${TAG}-win-x64-all.jar"
          cp dht-jni-native-win-x64/build/libs/dht-jni-native-win-x64-*.jar dist/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          generate_release_notes: false
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
