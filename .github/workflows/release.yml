# 每次发版默认：Linux x64 + Windows x64 + Linux aarch64 + macOS aarch64 的 sample 胖 JAR 与对应 native JAR。
# https://github.com/0xddy/dht-crawler/releases
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "本仓库 Release 对应 tag，例如 v1.0.0"
        required: true
        default: "v1.0.0"
      native_source:
        description: "native：release_zip=上游预编译 zip；cargo=本机 cargo 编（仅手动时）"
        type: choice
        options:
          - release_zip
          - cargo
        default: release_zip
      dht_crawler_tag:
        description: "上游 JNI 版本，留空=latest（如 v1.0.2）"
        required: false
        default: ""
      library_version:
        description: "库 JAR 版本号（如 1.2.0 → dht-jni-native-linux-x64-1.2.0.jar）；留空则用仓库 gradle.properties 里 dht.kt.version"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  DHT_CRAWLER_REPO: https://github.com/0xddy/dht-crawler.git
  DHT_CRAWLER_API: https://api.github.com/repos/0xddy/dht-crawler

jobs:
  release-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 下载 JNI (Linux) — 手动 + release_zip
        if: github.event_name == 'workflow_dispatch' && inputs.native_source == 'release_zip'
        run: |
          set -e
          TAG="${{ inputs.dht_crawler_tag }}"
          if [ -n "$TAG" ]; then API="${{ env.DHT_CRAWLER_API }}/releases/tags/${TAG}"; else API="${{ env.DHT_CRAWLER_API }}/releases/latest"; fi
          JSON=$(curl -sSL -H "Accept: application/vnd.github+json" "$API")
          echo "$JSON" | python3 -c "
          import json, sys, os, urllib.request, zipfile, shutil
          j = json.load(sys.stdin)
          if 'assets' not in j: print(j.get('message', j)); sys.exit(1)
          for a in j['assets']:
              if a['name'].startswith('dht_crawler_jni-') and a['name'].endswith('x86_64-unknown-linux-gnu.zip'):
                  urllib.request.urlretrieve(a['browser_download_url'], 'jni.zip')
                  zipfile.ZipFile('jni.zip').extractall('jni_out')
                  d = 'dht-jni-native-linux-x64/src/main/resources/native/linux-x64'
                  os.makedirs(d, exist_ok=True)
                  for root, _, files in os.walk('jni_out'):
                      for f in files:
                          if f.endswith('.so'):
                              shutil.copy2(os.path.join(root, f), os.path.join(d, 'libdht_crawler.so'))
                              print('OK', a['name']); sys.exit(0)
                  sys.exit('no .so')
          sys.exit('no linux jni zip')
          "

      - uses: dtolnay/rust-toolchain@stable
        if: github.event_name == 'workflow_dispatch' && inputs.native_source == 'cargo'

      - name: Cargo JNI (Linux)
        if: github.event_name == 'workflow_dispatch' && inputs.native_source == 'cargo'
        run: |
          git clone --depth 1 "${{ env.DHT_CRAWLER_REPO }}" dht-crawler-build
          cd dht-crawler-build && cargo build --release --features jni
          mkdir -p ../dht-jni-native-linux-x64/src/main/resources/native/linux-x64
          cp -v target/release/libdht_crawler.so ../dht-jni-native-linux-x64/src/main/resources/native/linux-x64/

      - name: 下载 JNI (Linux) — push tag 默认
        if: github.event_name == 'push'
        run: |
          set -e
          JSON=$(curl -sSL -H "Accept: application/vnd.github+json" "${{ env.DHT_CRAWLER_API }}/releases/latest")
          echo "$JSON" | python3 -c "
          import json, sys, os, urllib.request, zipfile, shutil
          j = json.load(sys.stdin)
          for a in j['assets']:
              if a['name'].startswith('dht_crawler_jni-') and a['name'].endswith('x86_64-unknown-linux-gnu.zip'):
                  urllib.request.urlretrieve(a['browser_download_url'], 'jni.zip')
                  zipfile.ZipFile('jni.zip').extractall('jni_out')
                  d = 'dht-jni-native-linux-x64/src/main/resources/native/linux-x64'
                  os.makedirs(d, exist_ok=True)
                  for root, _, files in os.walk('jni_out'):
                      for f in files:
                          if f.endswith('.so'):
                              shutil.copy2(os.path.join(root, f), os.path.join(d, 'libdht_crawler.so'))
                              sys.exit(0)
                  sys.exit('no .so')
          sys.exit('no linux jni zip')
          "

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Fat JAR + 依赖库 JAR
        run: |
          chmod +x gradlew
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}"
          EXTRA=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.library_version }}" ]; then
            EXTRA="-Pdht.kt.version=${{ inputs.library_version }}"
          fi
          ./gradlew $EXTRA :dht-jni-sample:shadowJar \
            :dht-jni-core:jar \
            :dht-jni-native-linux-x64:jar \
            --no-daemon
          mkdir -p dist
          cp -v "$(ls dht-jni-sample/build/libs/dht-sample-*-all.jar | head -1)" "dist/dht-sample-${TAG}-linux-x64-all.jar"
          cp -v dht-jni-core/build/libs/dht-jni-core-*.jar dist/
          cp -v dht-jni-native-linux-x64/build/libs/dht-jni-native-linux-x64-*.jar dist/
          ls -la dist/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

