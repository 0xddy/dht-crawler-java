          cd dht-crawler-build && cargo build --release --features jni
          mkdir -p ../dht-jni-native-osx-aarch64/src/main/resources/native/osx-aarch64
          cp -v target/release/libdht_crawler.dylib ../dht-jni-native-osx-aarch64/src/main/resources/native/osx-aarch64/

